<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Joubert Jose — Full-stack engineering, applied AI, machine learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f3ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f3ff" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M0 50H140L180 90H330"/>
    <path d="M1000 230H860L820 190H680"/>
    <path d="M0 240H90L120 210H250"/>
    <path d="M1000 40H900L870 70H760"/>
  </g>
  <g fill="none" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 200" filter="url(#glow)">
    <path d="M0 50H140L180 90H330"><animate attributeName="stroke-dashoffset" from="214" to="0" dur="3.2s" repeatCount="indefinite"/></path>
    <path d="M1000 230H860L820 190H680"><animate attributeName="stroke-dashoffset" from="214" to="0" dur="3.8s" repeatCount="indefinite"/></path>
    <path d="M0 240H90L120 210H250"><animate attributeName="stroke-dashoffset" from="214" to="0" dur="4.4s" repeatCount="indefinite"/></path>
    <path d="M1000 40H900L870 70H760"><animate attributeName="stroke-dashoffset" from="214" to="0" dur="3.5s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#00f3ff" filter="url(#glow)">
    <circle cx="330" cy="90" r="4"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="190" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="210" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="70" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text -->
  <text x="500" y="82" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" letter-spacing="6" fill="#6b7a99">&gt; HELLO, WORLD. I AM</text>
  <text x="500" y="152" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="4" fill="url(#name)" filter="url(#glow)">JOUBERT JOSE</text>
  <text x="500" y="196" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" letter-spacing="3" fill="#c9d4ee">FULL-STACK  ·  APPLIED AI  ·  MACHINE LEARNING</text>
  <text x="500" y="226" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" letter-spacing="2" fill="#6b7a99">B.TECH CSE · SJCET PALAI · PUBLISHED RESEARCHER<tspan fill="#00f3ff"> █</tspan>
    <animate attributeName="opacity" values="1;1;1;0.85;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>
