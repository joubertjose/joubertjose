<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f3ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1000" height="1.5" fill="url(#fade)"/>
  <circle r="3.5" cy="11.75" fill="#00f3ff">
    <animate attributeName="cx" from="0" to="1000" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <rect x="490" y="6" width="20" height="12" rx="2" fill="none" stroke="#00f3ff" stroke-opacity="0.7"/>
